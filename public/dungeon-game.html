<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智障探险队 - 地牢探险</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #fff;
        }
        h1 { color: #ffd700; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        #controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: none; padding: 10px 20px; font-size: 14px;
            cursor: pointer; border-radius: 5px; color: #000; font-weight: bold;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.4); }
        #game-container { position: relative; }
        #game-canvas { 
            border: 3px solid #ffd700; 
            border-radius: 8px; 
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #status {
            margin-top: 15px; padding: 10px 20px;
            background: rgba(0,0,0,0.8); border-radius: 8px;
            border: 2px solid #ffd700; font-size: 14px;
        }
        #instructions {
            margin-top: 10px; font-size: 12px; color: #aaa;
        }
        .loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 24px; color: #ffd700;
        }
    </style>
</head>
<body>
    <h1>智障探险队 - 地牢探险</h1>
    <div id="controls">
        <button onclick="generateDungeon()">🎲 生成新地牢</button>
        <button onclick="changeTheme()">🎨 切换主题</button>
        <button onclick="toggleView()">👁️ 切换视角</button>
    </div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>
    <div id="status">
        💰 金币: <span id="gold">0</span> | 
        ❤️ 生命: <span id="hp">100</span>/100 | 
        📍 层数: <span id="floor">1</span> | 
        📦 物品: <span id="items">0</span>
    </div>
    <div id="instructions">WASD/方向键移动 | R 重新生成 | M 切换主题</div>

    <script type="module">
        // ============ 瓦片配置 (根据用户的 tiles_v2.tsx) ============
        const TILE_CONFIG = {
            tilewidth: 190,
            tileheight: 195,
            spacing: 55,
            margin: 15,
            columns: 5
        };

        // 瓦片类型映射 (根据瓦片位置)
        const TILES = {
            EMPTY: 0,       // 虚空/黑
            GRASS: 1,        // 草地
            WALL: 2,         // 墙壁
            FLOOR: 3,        // 地板
            DOOR: 4,         // 门
            CHEST: 5,        // 宝箱
            TRAP: 6,         // 陷阱
            ENEMY: 7,        // 敌人
            STAIRS_DOWN: 8,  // 下楼
            STAIRS_UP: 9,    // 上楼
            WATER: 10,       // 水
            TREE: 11,        // 树
            CHEST_OPEN: 12,  // 开宝箱
            PLAYER: 20,      // 玩家
            GULU: 21         // Gulu NPC
        };

        // ============ 主题配置 ============
        const THEMES = {
            forest: { name: '🌲 森林', floor: 'GRASS', wall: 'TREE', ground: 'GRASS' },
            dungeon: { name: '🏰 地牢', floor: 'FLOOR', wall: 'WALL', ground: 'FLOOR' },
            cave: { name: '🕳️ 洞穴', floor: 'WALL', wall: 'WALL', ground: 'FLOOR' },
            castle: { name: '🏯 城堡', floor: 'FLOOR', wall: 'WALL', ground: 'DOOR' }
        };
        let currentTheme = 'dungeon';

        // ============ 游戏状态 ============
        let canvas, ctx;
        let tilesetImage = null;
        let tileSize = 64; // 渲染尺寸
        let mapWidth = 20;
        let mapHeight = 15;
        let dungeonMap = [];
        let entities = [];
        let player = { x: 0, y: 0, gold: 0, hp: 100, maxHp: 100, items: 0, floor: 1 };
        let showTileset = false;
        let isLoaded = false;

        // ============ 瓦片图加载 ============
        async function loadTileset() {
            return new Promise((resolve, reject) => {
                tilesetImage = new Image();
                tilesetImage.onload = () => {
                    console.log('瓦片图加载成功:', tilesetImage.width, 'x', tilesetImage.height);
                    isLoaded = true;
                    resolve();
                };
                tilesetImage.onerror = () => {
                    console.error('瓦片图加载失败');
                    reject();
                };
                // 使用用户上传的瓦片图
                tilesetImage.src = '/public/tilesets/tiles_v2.png';
            });
        }

        // ============ 获取瓦片在图集的位置 ============
        function getTilePosition(tileIndex) {
            const { tilewidth, tileheight, spacing, margin, columns } = TILE_CONFIG;
            const col = tileIndex % columns;
            const row = Math.floor(tileIndex / columns);
            const x = margin + col * (tilewidth + spacing);
            const y = margin + row * (tileheight + spacing);
            return { x, y, width: tilewidth, height: tileheight };
        }

        // ============ 绘制单个瓦片 ============
        function drawTile(ctx, tileIndex, destX, destY, destSize) {
            if (!tilesetImage || tileIndex < 0) return;
            
            const src = getTilePosition(tileIndex);
            
            // 计算缩放比例
            const scale = destSize / TILE_CONFIG.tilewidth;
            const scaledHeight = TILE_CONFIG.tileheight * scale;
            
            ctx.drawImage(
                tilesetImage,
                src.x, src.y, src.width, src.height,
                destX, destY - (scaledHeight - destSize), destSize, scaledHeight
            );
        }

        // ============ BSP 地牢生成 ============
        class BSPNode {
            constructor(x, y, w, h) {
                this.x = x; this.y = y;
                this.w = w; this.h = h;
                this.left = null;
                this.right = null;
                this.room = null;
            }

            split() {
                if (this.left || this.right) return false;

                let horiz = Math.random() > 0.5;
                if (this.w / this.h >= 1.25) horiz = false;
                else if (this.h / this.w >= 1.25) horiz = true;

                const max = (horiz ? this.h : this.w) - 6;
                if (max <= 6) return false;

                const split = Math.floor(Math.random() * (max - 6)) + 6;

                if (horiz) {
                    this.left = new BSPNode(this.x, this.y, this.w, split);
                    this.right = new BSPNode(this.x, this.y + split, this.w, this.h - split);
                } else {
                    this.left = new BSPNode(this.x, this.y, split, this.h);
                    this.right = new BSPNode(this.x + split, this.y, this.w - split, this.h);
                }
                return true;
            }

            createRooms() {
                if (this.left || this.right) {
                    if (this.left) this.left.createRooms();
                    if (this.right) this.right.createRooms();
                } else {
                    const roomW = Math.floor(Math.random() * (this.w - 4)) + 3;
                    const roomH = Math.floor(Math.random() * (this.h - 4)) + 3;
                    const roomX = this.x + Math.floor(Math.random() * (this.w - roomW - 1)) + 1;
                    const roomY = this.y + Math.floor(Math.random() * (this.h - roomH - 1)) + 1;
                    this.room = { x: roomX, y: roomY, w: roomW, h: roomH };
                }
            }

            getRoom() {
                if (this.room) return this.room;
                let leftRoom = null, rightRoom = null;
                if (this.left) leftRoom = this.left.getRoom();
                if (this.right) rightRoom = this.right.getRoom();
                if (!leftRoom && !rightRoom) return null;
                if (!leftRoom) return rightRoom;
                if (!rightRoom) return leftRoom;
                return Math.random() > 0.5 ? leftRoom : rightRoom;
            }
        }

        // ============ 生成地牢 ============
        function generateDungeon() {
            // 初始化地图
            dungeonMap = [];
            for (let y = 0; y < mapHeight; y++) {
                dungeonMap[y] = [];
                for (let x = 0; x < mapWidth; x++) {
                    dungeonMap[y][x] = { type: TILES.WALL, discovered: false };
                }
            }

            // BSP 分割
            const root = new BSPNode(0, 0, mapWidth, mapHeight);
            const iterations = 4;
            const nodes = [root];
            for (let i = 0; i < iterations; i++) {
                const newNodes = [];
                for (const node of nodes) {
                    if (node.split()) {
                        newNodes.push(node.left, node.right);
                    } else {
                        newNodes.push(node);
                    }
                }
                nodes.length = 0;
                nodes.push(...newNodes);
            }
            root.createRooms();

            // 绘制房间
            const rooms = [];
            for (const node of nodes) {
                if (node.room) {
                    rooms.push(node.room);
                    for (let y = node.room.y; y < node.room.y + node.room.h; y++) {
                        for (let x = node.room.x; x < node.room.x + node.room.w; x++) {
                            if (y >= 0 && y < mapHeight && x >= 0 && x < mapWidth) {
                                dungeonMap[y][x].type = TILES.FLOOR;
                            }
                        }
                    }
                }
            }

            // 连接房间 (走廊)
            for (let i = 0; i < rooms.length - 1; i++) {
                const r1 = rooms[i];
                const r2 = rooms[i + 1];
                const x1 = Math.floor(r1.x + r1.w / 2);
                const y1 = Math.floor(r1.y + r1.h / 2);
                const x2 = Math.floor(r2.x + r2.w / 2);
                const y2 = Math.floor(r2.y + r2.h / 2);

                let cx = x1, cy = y1;
                while (cx !== x2) {
                    if (cy >= 0 && cy < mapHeight && cx >= 0 && cx < mapWidth) {
                        dungeonMap[cy][cx].type = TILES.FLOOR;
                    }
                    cx += cx < x2 ? 1 : -1;
                }
                while (cy !== y2) {
                    if (cy >= 0 && cy < mapHeight && cx >= 0 && cx < mapWidth) {
                        dungeonMap[cy][cx].type = TILES.FLOOR;
                    }
                    cy += cy < y2 ? 1 : -1;
                }
            }

            // 添加实体
            entities = [];
            
            // 放置玩家
            if (rooms.length > 0) {
                const startRoom = rooms[0];
                player.x = Math.floor(startRoom.x + startRoom.w / 2);
                player.y = Math.floor(startRoom.y + startRoom.h / 2);
            }

            // 放置楼梯
            if (rooms.length > 1) {
                const lastRoom = rooms[rooms.length - 1];
                const sx = Math.floor(lastRoom.x + lastRoom.w / 2);
                const sy = Math.floor(lastRoom.y + lastRoom.h / 2);
                entities.push({ x: sx, y: sy, type: 'stairs_down', tile: TILES.STAIRS_DOWN });
            }

            // 放置宝箱
            for (let i = 1; i < rooms.length - 1; i++) {
                if (Math.random() > 0.5) {
                    const r = rooms[i];
                    entities.push({
                        x: r.x + 1, y: r.y + 1,
                        type: 'chest', tile: TILES.CHEST,
                        opened: false, gold: Math.floor(Math.random() * 30) + 10
                    });
                }
            }

            // 放置敌人
            for (let i = 0; i < rooms.length; i++) {
                if (Math.random() > 0.4) {
                    const r = rooms[i];
                    const ex = r.x + Math.floor(Math.random() * r.w);
                    const ey = r.y + Math.floor(Math.random() * r.h);
                    if ((ex !== player.x || ey !== player.y) && !entities.find(e => e.x === ex && e.y === ey)) {
                        entities.push({ x: ex, y: ey, type: 'enemy', tile: TILES.ENEMY, hp: 30 });
                    }
                }
            }

            // 放置 Gulu NPC
            if (rooms.length > 2 && Math.random() > 0.5) {
                const r = rooms[Math.floor(rooms.length / 2)];
                entities.push({ x: r.x + r.w - 2, y: r.y + r.h - 2, type: 'npc', tile: TILES.GULU, name: '咕噜' });
            }

            render();
            updateStatus();
        }

        // ============ 渲染 ============
        function render() {
            if (!canvas) return;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const theme = THEMES[currentTheme];
            
            // 绘制地图
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    const tile = dungeonMap[y][x];
                    const px = x * tileSize;
                    const py = y * tileSize;

                    if (tile.type === TILES.WALL) {
                        // 墙壁 - 使用第一个瓦片 (带边框的墙)
                        drawTile(ctx, 0, px, py, tileSize);
                    } else if (tile.type === TILES.FLOOR) {
                        // 地板 - 使用第二个瓦片 (深色地板)
                        drawTile(ctx, 1, px, py, tileSize);
                    }
                }
            }

            // 绘制实体
            for (const entity of entities) {
                const px = entity.x * tileSize;
                const py = entity.y * tileSize;
                
                let tileIndex = entity.tile;
                if (entity.type === 'chest' && entity.opened) {
                    tileIndex = TILES.CHEST_OPEN;
                }
                
                drawTile(ctx, tileIndex, px, py, tileSize);
            }

            // 绘制玩家
            const playerPx = player.x * tileSize;
            const playerPy = player.y * tileSize;
            
            // 玩家背景
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(playerPx + tileSize/2, playerPy + tileSize/2, tileSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 玩家图标
            ctx.fillStyle = '#fff';
            ctx.font = `${tileSize * 0.6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👤', playerPx + tileSize/2, playerPy + tileSize/2);

            // 调试：显示瓦片图预览
            if (showTileset) {
                ctx.fillStyle = 'rgba(0,0,0,0.9)';
                ctx.fillRect(0, 0, canvas.width, 100);
                for (let i = 0; i < 20; i++) {
                    drawTile(ctx, i, i * 65, 10, 60);
                }
            }
        }

        // ============ 移动 ============
        function movePlayer(dx, dy) {
            const newX = player.x + dx;
            const newY = player.y + dy;

            // 边界检查
            if (newX < 0 || newX >= mapWidth || newY < 0 || newY >= mapHeight) return;
            
            // 障碍物检查
            if (dungeonMap[newY][newX].type === TILES.WALL) return;

            // 实体交互检查
            const entity = entities.find(e => e.x === newX && e.y === newY);
            if (entity) {
                if (entity.type === 'chest' && !entity.opened) {
                    entity.opened = true;
                    player.gold += entity.gold;
                    player.items++;
                    updateStatus();
                } else if (entity.type === 'stairs_down') {
                    player.floor++;
                    generateDungeon();
                    return;
                } else if (entity.type === 'stairs_up' && player.floor > 1) {
                    player.floor--;
                    generateDungeon();
                    return;
                } else if (entity.type === 'enemy') {
                    player.hp -= 10;
                    if (player.hp <= 0) {
                        player.hp = player.maxHp;
                        player.gold = Math.floor(player.gold / 2);
                        player.floor = 1;
                    }
                    updateStatus();
                } else if (entity.type === 'npc') {
                    // NPC 对话
                    alert(`${entity.name}: 咕噜咕噜！我是这里的向导！`);
                }
                return;
            }

            player.x = newX;
            player.y = newY;
            render();
        }

        // ============ 更新状态 ============
        function updateStatus() {
            document.getElementById('gold').textContent = player.gold;
            document.getElementById('hp').textContent = player.hp;
            document.getElementById('floor').textContent = player.floor;
            document.getElementById('items').textContent = player.items;
        }

        // ============ 主题切换 ============
        function changeTheme() {
            const themeKeys = Object.keys(THEMES);
            const currentIndex = themeKeys.indexOf(currentTheme);
            currentTheme = themeKeys[(currentIndex + 1) % themeKeys.length];
            render();
        }

        // ============ 视角切换 ============
        function toggleView() {
            showTileset = !showTileset;
            render();
        }

        // ============ 初始化 ============
        async function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            
            // 设置画布大小
            canvas.width = mapWidth * tileSize;
            canvas.height = mapHeight * tileSize;

            try {
                await loadTileset();
                generateDungeon();
            } catch (e) {
                console.error('加载失败，使用备用模式');
                generateDungeon();
            }

            // 键盘控制
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'w': case 'arrowup': movePlayer(0, -1); break;
                    case 's': case 'arrowdown': movePlayer(0, 1); break;
                    case 'a': case 'arrowleft': movePlayer(-1, 0); break;
                    case 'd': case 'arrowright': movePlayer(1, 0); break;
                    case 'r': generateDungeon(); break;
                    case 'm': changeTheme(); break;
                }
            });
        }

        // 暴露全局函数
        window.generateDungeon = generateDungeon;
        window.changeTheme = changeTheme;
        window.toggleView = toggleView;

        init();
    </script>
</body>
</html>
