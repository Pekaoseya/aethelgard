<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智障探险队 - RPG游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            color: #eee; 
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            margin: 20px; 
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #game-container { 
            border: 4px solid #ffd700; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        #rpg-canvas { 
            display: block; 
            background: #2d2d44;
        }
        .controls {
            margin: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .status {
            margin: 10px;
            display: flex;
            gap: 20px;
            font-size: 16px;
        }
        .status span { color: #ffd700; }
        #message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            display: none;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <h1>🎮 智障探险队</h1>
    
    <div class="status">
        <div>❤️ 生命: <span id="hp">100</span></div>
        <div>💰 金币: <span id="gold">0</span></div>
        <div>🗺️ 层数: <span id="floor">1</span></div>
    </div>
    
    <div id="game-container">
        <canvas id="rpg-canvas" width="640" height="480"></canvas>
    </div>
    
    <div class="controls">
        <button onclick="game.generateMap()">🎲 新地图</button>
        <button onclick="game.toggleGrid()">📐 显示网格</button>
        <button onclick="game.toggleDebug()">🐛 调试信息</button>
    </div>
    
    <div id="message"></div>

    <script type="module">
        // 瓦片配置（tiles_v2.tsx: tilewidth=190, tileheight=195, spacing=55, margin=15, columns=5）
        const TILE_SIZE = 64; // 渲染尺寸
        const TILESET_COLS = 5;
        
        // 从 tiles_v2.tsx 解析的实际瓦片位置
        // 位置 = margin + index * (tileSize + spacing)
        // x = 15 + (index % 5) * 245
        // y = 15 + Math.floor(index / 5) * 250
        
        // 瓦片定义（基于用户的 tiles_v2.tsx）
        const TILES = {
            0: { name: '草地', passable: true, srcX: 15, srcY: 15 },
            1: { name: '石墙', passable: false, srcX: 260, srcY: 15 },
            2: { name: '宝箱', passable: true, type: 'chest', srcX: 505, srcY: 15 },
            3: { name: '泥土', passable: true, srcX: 750, srcY: 15 },
            4: { name: '虚空', passable: false, srcX: 995, srcY: 15 },
            // 更多瓦片...
            5: { name: '木板', passable: true, srcX: 15, srcY: 250 },
            6: { name: '石板', passable: true, srcX: 260, srcY: 250 },
            7: { name: '楼梯上', passable: true, type: 'stairs_up', srcX: 505, srcY: 250 },
            8: { name: '楼梯下', passable: true, type: 'stairs_down', srcX: 750, srcY: 250 },
            9: { name: '水', passable: false, srcX: 995, srcY: 250 },
        };
        
        class RPGGame {
            constructor() {
                this.canvas = document.getElementById('rpg-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.mapWidth = 20;
                this.mapHeight = 15;
                this.tileSize = TILE_SIZE;
                
                this.player = {
                    x: 5, y: 5,
                    charX: 0, charY: 0, // 角色图位置
                    hp: 100,
                    gold: 0,
                    floor: 1
                };
                
                this.characters = [];
                this.items = [];
                this.npcs = [];
                this.tileset = null;
                this.map = [];
                this.showGrid = false;
                this.showDebug = false;
                this.visited = new Set();
                
                this.keys = {};
                this.moving = false;
                
                this.init();
            }
            
            async init() {
                await this.loadTileset();
                this.generateMap();
                this.setupControls();
                this.gameLoop();
            }
            
            async loadTileset() {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        this.tileset = img;
                        console.log('瓦片图加载成功:', img.width, 'x', img.height);
                        resolve();
                    };
                    img.onerror = () => {
                        console.log('瓦片图加载失败，使用备用渲染');
                        this.tileset = null;
                        resolve();
                    };
                    img.src = '/public/tilesets/tiles_v2.png';
                });
            }
            
            generateMap() {
                this.map = [];
                
                // 生成房间（BSP算法简化版）
                const rooms = [];
                const numRooms = 5 + Math.floor(Math.random() * 5);
                
                for (let i = 0; i < numRooms; i++) {
                    const roomWidth = 3 + Math.floor(Math.random() * 4);
                    const roomHeight = 3 + Math.floor(Math.random() * 4);
                    const roomX = 1 + Math.floor(Math.random() * (this.mapWidth - roomWidth - 2));
                    const roomY = 1 + Math.floor(Math.random() * (this.mapHeight - roomHeight - 2));
                    
                    // 检查重叠
                    let overlaps = false;
                    for (const room of rooms) {
                        if (roomX < room.x + room.w + 1 && roomX + roomWidth + 1 > room.x &&
                            roomY < room.y + room.h + 1 && roomY + roomHeight + 1 > room.y) {
                            overlaps = true;
                            break;
                        }
                    }
                    
                    if (!overlaps) {
                        rooms.push({ x: roomX, y: roomY, w: roomWidth, h: roomHeight });
                    }
                }
                
                // 初始化地图为墙壁
                for (let y = 0; y < this.mapHeight; y++) {
                    this.map[y] = [];
                    for (let x = 0; x < this.mapWidth; x++) {
                        this.map[y][x] = 4; // 虚空/墙壁
                    }
                }
                
                // 填充房间
                for (const room of rooms) {
                    for (let y = room.y; y < room.y + room.h; y++) {
                        for (let x = room.x; x < room.x + room.w; x++) {
                            if (y === room.y || y === room.y + room.h - 1 || 
                                x === room.x || x === room.x + room.w - 1) {
                                this.map[y][x] = 1; // 墙壁
                            } else {
                                this.map[y][x] = Math.random() > 0.7 ? 3 : 0; // 泥土或草地
                            }
                        }
                    }
                }
                
                // 连接房间（走廊）
                for (let i = 0; i < rooms.length - 1; i++) {
                    const room1 = rooms[i];
                    const room2 = rooms[i + 1];
                    
                    const x1 = Math.floor(room1.x + room1.w / 2);
                    const y1 = Math.floor(room1.y + room1.h / 2);
                    const x2 = Math.floor(room2.x + room2.w / 2);
                    const y2 = Math.floor(room2.y + room2.h / 2);
                    
                    // 随机选择水平或垂直先走
                    if (Math.random() > 0.5) {
                        this.carveHorizontalTunnel(x1, x2, y1);
                        this.carveVerticalTunnel(y1, y2, x2);
                    } else {
                        this.carveVerticalTunnel(y1, y2, x1);
                        this.carveHorizontalTunnel(x1, x2, y2);
                    }
                }
                
                // 放置玩家在第一个房间
                if (rooms.length > 0) {
                    this.player.x = rooms[0].x + Math.floor(rooms[0].w / 2);
                    this.player.y = rooms[0].y + Math.floor(rooms[0].h / 2);
                }
                
                // 放置楼梯
                if (rooms.length > 1) {
                    const lastRoom = rooms[rooms.length - 1];
                    this.map[lastRoom.y + Math.floor(lastRoom.h / 2)][lastRoom.x + Math.floor(lastRoom.w / 2)] = 8;
                }
                
                // 放置宝箱
                this.items = [];
                for (let i = 1; i < rooms.length - 1; i++) {
                    const room = rooms[i];
                    if (Math.random() > 0.5) {
                        this.items.push({
                            x: room.x + Math.floor(Math.random() * room.w),
                            y: room.y + Math.floor(Math.random() * room.h),
                            type: 'chest',
                            gold: 10 + Math.floor(Math.random() * 20)
                        });
                        this.map[room.y + Math.floor(room.h / 2)][room.x + Math.floor(room.w / 2)] = 2;
                    }
                }
                
                // 放置NPC
                this.npcs = [];
                const npcNames = ['💬 村民A', '💬 商人', '💬 老人', '💬 小孩'];
                for (let i = 1; i < Math.min(rooms.length, 4); i++) {
                    const room = rooms[i];
                    this.npcs.push({
                        x: room.x + 1,
                        y: room.y + 1,
                        name: npcNames[i % npcNames.length],
                        dialog: this.getRandomDialog()
                    });
                }
                
                // 放置敌人
                this.enemies = [];
                for (let i = 2; i < rooms.length - 1; i++) {
                    const room = rooms[i];
                    if (Math.random() > 0.4) {
                        this.enemies.push({
                            x: room.x + Math.floor(room.w / 2),
                            y: room.y + Math.floor(room.h / 2),
                            hp: 20 + Math.floor(Math.random() * 30),
                            name: ['👹 史莱姆', '👻 幽灵', '🦇 蝙蝠'][Math.floor(Math.random() * 3)]
                        });
                    }
                }
                
                this.showMessage('新地图已生成！');
            }
            
            carveHorizontalTunnel(x1, x2, y) {
                for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                    if (y > 0 && y < this.mapHeight - 1) {
                        this.map[y][x] = this.map[y][x] === 4 ? 3 : this.map[y][x];
                    }
                }
            }
            
            carveVerticalTunnel(y1, y2, x) {
                for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                    if (x > 0 && x < this.mapWidth - 1) {
                        this.map[y][x] = this.map[y][x] === 4 ? 3 : this.map[y][x];
                    }
                }
            }
            
            getRandomDialog() {
                const dialogs = [
                    '你好啊，冒险者！',
                    '听说地下深处有宝藏...',
                    '小心那些讨厌的史莱姆！',
                    '这附近经常有幽灵出没。',
                    '往北走有个秘密房间。',
                    '你想要买些什么吗？',
                    '听说这座迷宫是无尽的...',
                    '祝你好运，勇士！'
                ];
                return dialogs[Math.floor(Math.random() * dialogs.length)];
            }
            
            setupControls() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    
                    if (!this.moving) {
                        this.handleMovement();
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });
            }
            
            handleMovement() {
                let dx = 0, dy = 0;
                
                if (this.keys['w'] || this.keys['arrowup']) dy = -1;
                else if (this.keys['s'] || this.keys['arrowdown']) dy = 1;
                else if (this.keys['a'] || this.keys['arrowleft']) dx = -1;
                else if (this.keys['d'] || this.keys['arrowright']) dx = 1;
                
                if (dx !== 0 || dy !== 0) {
                    this.moving = true;
                    const newX = this.player.x + dx;
                    const newY = this.player.y + dy;
                    
                    if (this.canMoveTo(newX, newY)) {
                        this.player.x = newX;
                        this.player.y = newY;
                        this.checkTileEffects();
                    }
                    
                    setTimeout(() => { this.moving = false; }, 100);
                }
            }
            
            canMoveTo(x, y) {
                if (x < 0 || x >= this.mapWidth || y < 0 || y >= this.mapHeight) return false;
                const tile = TILES[this.map[y][x]];
                return tile && tile.passable;
            }
            
            checkTileEffects() {
                const tileId = this.map[this.player.y][this.player.x];
                const tile = TILES[tileId];
                
                if (tile) {
                    switch (tile.type) {
                        case 'chest':
                            // 收集金币
                            const item = this.items.find(i => i.x === this.player.x && i.y === this.player.y);
                            if (item && !item.collected) {
                                item.collected = true;
                                this.player.gold += item.gold;
                                this.showMessage(`💰 获得 ${item.gold} 金币！`);
                                document.getElementById('gold').textContent = this.player.gold;
                                this.map[this.player.y][this.player.x] = 17; // 打开的宝箱
                            }
                            break;
                        case 'stairs_down':
                            this.player.floor++;
                            this.generateMap();
                            document.getElementById('floor').textContent = this.player.floor;
                            this.showMessage(`⬇️ 进入第 ${this.player.floor} 层！`);
                            break;
                    }
                }
                
                // 检查与NPC对话
                const npc = this.npcs.find(n => n.x === this.player.x && n.y === this.player.y);
                if (npc) {
                    this.showMessage(`${npc.name}: "${npc.dialog}"`);
                }
                
                // 检查敌人
                const enemy = this.enemies.find(e => e.x === this.player.x && e.y === this.player.y);
                if (enemy) {
                    enemy.hp -= 10;
                    this.player.hp -= 5;
                    document.getElementById('hp').textContent = this.player.hp;
                    
                    if (enemy.hp <= 0) {
                        this.enemies = this.enemies.filter(e => e !== enemy);
                        this.player.gold += 5;
                        document.getElementById('gold').textContent = this.player.gold;
                        this.showMessage(`⚔️ 击败 ${enemy.name}！获得 5 金币`);
                    } else {
                        this.showMessage(`⚔️ 与 ${enemy.name} 战斗！双方受伤`);
                    }
                }
                
                // 更新角色图位置
                this.player.charY = Math.floor(Math.random() * 4) * 3;
            }
            
            showMessage(text) {
                const msg = document.getElementById('message');
                msg.textContent = text;
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 2000);
            }
            
            toggleGrid() {
                this.showGrid = !this.showGrid;
            }
            
            toggleDebug() {
                this.showDebug = !this.showDebug;
            }
            
            render() {
                // 清空画布
                this.ctx.fillStyle = '#1a1a2e';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 计算视口偏移（玩家居中）
                const offsetX = this.canvas.width / 2 - this.player.x * this.tileSize - this.tileSize / 2;
                const offsetY = this.canvas.height / 2 - this.player.y * this.tileSize - this.tileSize / 2;
                
                // 渲染地图
                for (let y = 0; y < this.mapHeight; y++) {
                    for (let x = 0; x < this.mapWidth; x++) {
                        const screenX = x * this.tileSize + offsetX;
                        const screenY = y * this.tileSize + offsetY;
                        
                        // 视口裁剪
                        if (screenX < -this.tileSize || screenX > this.canvas.width ||
                            screenY < -this.tileSize || screenY > this.canvas.height) continue;
                        
                        const tileId = this.map[y][x];
                        
                        if (this.tileset) {
                            // 使用瓦片图
                            const srcX = (tileId % TILESET_COLS) * 190 + 15;
                            const srcY = Math.floor(tileId / TILESET_COLS) * 195 + 15;
                            
                            this.ctx.drawImage(
                                this.tileset,
                                srcX, srcY, 190, 195,
                                screenX, screenY, this.tileSize, this.tileSize
                            );
                        } else {
                            // 备用渲染
                            const colors = ['#4a7c4e', '#5a5a5a', '#ffd700', '#8b7355', '#1a1a1a'];
                            this.ctx.fillStyle = colors[tileId % colors.length] || '#333';
                            this.ctx.fillRect(screenX, screenY, this.tileSize, this.tileSize);
                        }
                        
                        // 网格
                        if (this.showGrid) {
                            this.ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                            this.ctx.strokeRect(screenX, screenY, this.tileSize, this.tileSize);
                        }
                    }
                }
                
                // 渲染物品
                for (const item of this.items) {
                    if (item.collected) continue;
                    const screenX = item.x * this.tileSize + offsetX;
                    const screenY = item.y * this.tileSize + offsetY;
                    this.ctx.font = '28px Arial';
                    this.ctx.fillText('📦', screenX + 15, screenY + 40);
                }
                
                // 渲染NPC
                for (const npc of this.npcs) {
                    const screenX = npc.x * this.tileSize + offsetX;
                    const screenY = npc.y * this.tileSize + offsetY;
                    
                    // NPC 身体
                    if (this.tileset) {
                        this.ctx.drawImage(
                            this.tileset,
                            128, 64, 128, 128,
                            screenX - 32, screenY - 64, 64, 64
                        );
                    } else {
                        this.ctx.fillStyle = '#ff6b6b';
                        this.ctx.beginPath();
                        this.ctx.arc(screenX + 32, screenY, 20, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    
                    // NPC 名字
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = '12px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(npc.name.replace('💬 ', ''), screenX + 32, screenY - 70);
                    this.ctx.textAlign = 'left';
                }
                
                // 渲染敌人
                for (const enemy of this.enemies) {
                    const screenX = enemy.x * this.tileSize + offsetX;
                    const screenY = enemy.y * this.tileSize + offsetY;
                    this.ctx.font = '28px Arial';
                    this.ctx.fillText(enemy.name.includes('史莱姆') ? '🟢' : enemy.name.includes('幽灵') ? '👻' : '🦇', 
                        screenX + 15, screenY + 40);
                }
                
                // 渲染玩家
                const playerScreenX = this.player.x * this.tileSize + offsetX;
                const playerScreenY = this.player.y * this.tileSize + offsetY;
                
                // 玩家阴影
                this.ctx.fillStyle = 'rgba(0,0,0,0.3)';
                this.ctx.beginPath();
                this.ctx.ellipse(playerScreenX + 32, playerScreenY + 60, 20, 8, 0, 0, Math.PI * 2);
                this.ctx.fill();
                
                // 玩家身体
                if (this.tileset) {
                    this.ctx.drawImage(
                        this.tileset,
                        this.player.charX, this.player.charY, 128, 128,
                        playerScreenX - 32, playerScreenY - 64, 64, 64
                    );
                } else {
                    // 玩家圆
                    this.ctx.fillStyle = '#4ecdc4';
                    this.ctx.beginPath();
                    this.ctx.arc(playerScreenX + 32, playerScreenY, 20, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                
                // 玩家标识
                this.ctx.font = '12px sans-serif';
                this.ctx.fillStyle = '#ffd700';
                this.ctx.fillText('你', playerScreenX + 24, playerScreenY - 70);
                
                // 调试信息
                if (this.showDebug) {
                    this.ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    this.ctx.fillRect(5, 5, 150, 80);
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = '12px monospace';
                    this.ctx.fillText(`位置: ${this.player.x}, ${this.player.y}`, 10, 25);
                    this.ctx.fillText(`HP: ${this.player.hp}`, 10, 45);
                    this.ctx.fillText(`金币: ${this.player.gold}`, 10, 65);
                }
            }
            
            gameLoop() {
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // 启动游戏
        window.game = new RPGGame();
    </script>
</body>
</html>
