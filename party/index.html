<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智障探险队 - 游戏客户端</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: white;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    
    .join-form {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      margin: 50px auto;
    }
    
    .join-form h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.3);
    }
    
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #ffd700;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button:hover {
      background: #ffed4a;
      transform: scale(1.02);
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    #game-container {
      display: none;
    }
    
    .game-layout {
      display: flex;
      gap: 20px;
    }
    
    #game-canvas {
      background: #000;
      border: 2px solid #ffd700;
      border-radius: 5px;
    }
    
    .sidebar {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
      max-width: 300px;
    }
    
    .player-info {
      margin-bottom: 20px;
    }
    
    .player-info h3 {
      color: #ffd700;
      margin-bottom: 10px;
    }
    
    .stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
    }
    
    .players-list {
      margin-top: 20px;
    }
    
    .players-list h4 {
      color: #ffd700;
      margin-bottom: 10px;
    }
    
    .player-item {
      padding: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .player-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    
    .event-log {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .event-log h4 {
      color: #ffd700;
      margin-bottom: 10px;
    }
    
    .event-item {
      padding: 5px;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .event-item.join {
      color: #00ff00;
    }
    
    .event-item.leave {
      color: #ff6666;
    }
    
    .event-item.move {
      color: #66ccff;
    }
    
    .event-item.collect {
      color: #ffd700;
    }
    
    .controls {
      margin-top: 20px;
      text-align: center;
    }
    
    .controls p {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
    }
    
    .status {
      text-align: center;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
    }
    
    .status.connected {
      background: rgba(0, 255, 0, 0.2);
      color: #00ff00;
    }
    
    .status.disconnected {
      background: rgba(255, 0, 0, 0.2);
      color: #ff6666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>智障探险队</h1>
    
    <div class="join-form" id="join-form">
      <h2>加入游戏</h2>
      <div class="form-group">
        <label>角色名称</label>
        <input type="text" id="player-name" placeholder="给你的角色起个名字" value="智障冒险家">
      </div>
      <div class="form-group">
        <label>选择角色</label>
        <select id="character-select">
          <option value="repeater">复读姬</option>
          <option value="carper">杠精博士</option>
          <option value="saint">圣母心</option>
          <option value="hallucinator">幻觉大师</option>
          <option value="sycophant">舔狗</option>
          <option value="prophet">预言家</option>
        </select>
      </div>
      <button id="join-btn">进入游戏</button>
      <div class="status" id="status">未连接</div>
    </div>
    
    <div id="game-container">
      <div class="game-layout">
        <div>
          <canvas id="game-canvas" width="640" height="480"></canvas>
          <div class="controls">
            <button id="up-btn">↑ 上</button>
            <div>
              <button id="left-btn">← 左</button>
              <button id="down-btn">↓ 下</button>
              <button id="right-btn">→ 右</button>
            </div>
            <p>WASD 或方向键移动 | 空格键互动</p>
          </div>
        </div>
        
        <div class="sidebar">
          <div class="player-info">
            <h3>我的状态</h3>
            <div class="stat">
              <span>HP</span>
              <span id="hp">100/100</span>
            </div>
            <div class="stat">
              <span>金币</span>
              <span id="gold">0</span>
            </div>
            <div class="stat">
              <span>楼层</span>
              <span id="floor">1</span>
            </div>
            <div class="stat">
              <span>混沌值</span>
              <span id="chaos">0%</span>
            </div>
          </div>
          
          <div class="players-list">
            <h4>在线玩家</h4>
            <div id="players-container"></div>
          </div>
          
          <div class="event-log">
            <h4>事件日志</h4>
            <div id="events-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== 配置 ====================
    const SERVER_URL = 'localhost:1999';
    const ROOM_NAME = 'stupid-adventure';
    
    // ==================== 游戏状态 ====================
    let ws = null;
    let myPlayerId = null;
    let gameState = null;
    let canvas, ctx;
    const TILE_SIZE = 32;
    const PLAYER_COLORS = [
      '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', 
      '#ffeaa7', '#dfe6e9', '#fd79a8', '#a29bfe'
    ];
    
    // ==================== 颜色定义 ====================
    const TILE_COLORS = {
      grass: '#2d5a27',
      wall: '#4a4a4a',
      path: '#8b7355',
      water: '#3498db',
      door: '#8b4513'
    };
    
    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      
      // 绑定按钮事件
      document.getElementById('join-btn').addEventListener('click', joinGame);
      document.getElementById('up-btn').addEventListener('click', () => move('up'));
      document.getElementById('down-btn').addEventListener('click', () => move('down'));
      document.getElementById('left-btn').addEventListener('click', () => move('left'));
      document.getElementById('right-btn').addEventListener('click', () => move('right'));
      
      // 键盘控制
      document.addEventListener('keydown', (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        
        switch(e.key) {
          case 'ArrowUp':
          case 'w':
          case 'W':
            move('up');
            break;
          case 'ArrowDown':
          case 's':
          case 'S':
            move('down');
            break;
          case 'ArrowLeft':
          case 'a':
          case 'A':
            move('left');
            break;
          case 'ArrowRight':
          case 'd':
          case 'D':
            move('right');
            break;
          case ' ':
            interact();
            break;
        }
      });
    });
    
    // ==================== WebSocket ====================
    function connect() {
      return new Promise((resolve, reject) => {
        ws = new WebSocket(`ws://${SERVER_URL}/${ROOM_NAME}`);
        
        ws.onopen = () => {
          console.log('连接成功');
          resolve();
        };
        
        ws.onerror = (error) => {
          console.error('连接错误:', error);
          reject(error);
        };
        
        ws.onclose = () => {
          console.log('连接断开');
          updateStatus('disconnected', '连接断开');
        };
        
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          handleMessage(msg);
        };
      });
    }
    
    async function joinGame() {
      const name = document.getElementById('player-name').value;
      const character = document.getElementById('character-select').value;
      
      try {
        updateStatus('connecting', '连接中...');
        await connect();
        
        // 发送加入消息
        ws.send(JSON.stringify({
          type: 'join',
          payload: { name, character }
        }));
        
      } catch (error) {
        updateStatus('disconnected', `连接失败: ${error.message}`);
      }
    }
    
    function move(direction) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'move',
        payload: { direction }
      }));
    }
    
    function interact() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'interact',
        payload: {}
      }));
    }
    
    // ==================== 消息处理 ====================
    function handleMessage(msg) {
      console.log('收到消息:', msg.type, msg.payload);
      
      switch(msg.type) {
        case 'connected':
          updateStatus('connected', '已连接到服务器');
          break;
          
        case 'welcome':
          myPlayerId = msg.payload.playerId;
          gameState = msg.payload.state;
          document.getElementById('join-form').style.display = 'none';
          document.getElementById('game-container').style.display = 'block';
          updateStatus('connected', '已加入游戏');
          updatePlayers();
          updateMyStats();
          render();
          break;
          
        case 'player_joined':
          if (gameState) {
            gameState.players.push(msg.payload);
            updatePlayers();
            addEvent('join', `${msg.payload.name} 加入了游戏`);
          }
          break;
          
        case 'player_left':
          if (gameState) {
            const idx = gameState.players.findIndex(p => p.id === msg.payload.playerId);
            if (idx !== -1) {
              addEvent('leave', `${gameState.players[idx].name} 离开了游戏`);
              gameState.players.splice(idx, 1);
              updatePlayers();
            }
          }
          break;
          
        case 'player_moved':
          if (gameState) {
            const player = gameState.players.find(p => p.id === msg.payload.playerId);
            if (player) {
              player.position = msg.payload.position;
              if (player.id === myPlayerId) {
                updateMyStats();
              }
              render();
            }
          }
          break;
          
        case 'item_collected':
          addEvent('collect', `${msg.payload.itemName} 被拾取`);
          if (gameState) {
            const idx = gameState.items.findIndex(i => i.id === msg.payload.itemId);
            if (idx !== -1) {
              gameState.items.splice(idx, 1);
            }
            updateMyStats();
            render();
          }
          break;
          
        case 'npc_spotted':
          addEvent('move', '发现 NPC');
          break;
          
        case 'npc_talked':
          addEvent('join', `NPC: ${msg.payload.dialogue}`);
          break;
          
        case 'floor_changed':
          gameState = msg.payload.state;
          updateMyStats();
          render();
          addEvent('join', `进入第 ${msg.payload.floor} 层`);
          break;
          
        case 'pong':
          // 心跳响应
          break;
      }
    }
    
    // ==================== 渲染 ====================
    function render() {
      if (!gameState) return;
      
      // 清空画布
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 绘制地图
      const map = gameState.map;
      for (let y = 0; y < map.length; y++) {
        for (let x = 0; x < map[y].length; x++) {
          const tile = map[y][x];
          ctx.fillStyle = TILE_COLORS[tile.type] || '#333';
          ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          
          // 添加网格线
          ctx.strokeStyle = 'rgba(255,255,255,0.1)';
          ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }
      
      // 绘制物品
      for (const item of gameState.items) {
        if (item.collectedBy) continue;
        
        ctx.fillStyle = '#ffd700';
        ctx.font = '20px Arial';
        ctx.fillText('💰', item.position.x * TILE_SIZE, item.position.y * TILE_SIZE + 24);
      }
      
      // 绘制 NPC
      for (const npc of gameState.npcs) {
        ctx.fillStyle = '#ff69b4';
        ctx.font = '24px Arial';
        ctx.fillText('🤖', npc.position.x * TILE_SIZE, npc.position.y * TILE_SIZE + 26);
      }
      
      // 绘制玩家
      let colorIndex = 0;
      for (const player of gameState.players) {
        const color = PLAYER_COLORS[colorIndex % PLAYER_COLORS.length];
        
        // 玩家圆圈
        ctx.beginPath();
        ctx.arc(
          player.position.x * TILE_SIZE + TILE_SIZE / 2,
          player.position.y * TILE_SIZE + TILE_SIZE / 2,
          TILE_SIZE / 2 - 4,
          0,
          Math.PI * 2
        );
        ctx.fillStyle = color;
        ctx.fill();
        
        // 玩家名字
        ctx.fillStyle = '#fff';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(
          player.name.substring(0, 6),
          player.position.x * TILE_SIZE + TILE_SIZE / 2,
          player.position.y * TILE_SIZE - 5
        );
        
        // 如果是自己的玩家，加个边框
        if (player.id === myPlayerId) {
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        
        colorIndex++;
      }
      
      // 绘制楼梯提示
      if (map.length > 0) {
        ctx.fillStyle = '#00ff00';
        ctx.font = '16px Arial';
        ctx.fillText('⬇️', (map[0].length - 2) * TILE_SIZE, (map.length - 2) * TILE_SIZE + 24);
      }
    }
    
    // ==================== UI 更新 ====================
    function updateStatus(type, message) {
      const status = document.getElementById('status');
      status.className = `status ${type}`;
      status.textContent = message;
    }
    
    function updateMyStats() {
      if (!gameState || !myPlayerId) return;
      
      const me = gameState.players.find(p => p.id === myPlayerId);
      if (!me) return;
      
      document.getElementById('hp').textContent = `${me.hp}/${me.maxHp}`;
      document.getElementById('gold').textContent = me.gold;
      document.getElementById('floor').textContent = gameState.floor;
      document.getElementById('chaos').textContent = `${me.chaos}%`;
    }
    
    function updatePlayers() {
      if (!gameState) return;
      
      const container = document.getElementById('players-container');
      container.innerHTML = '';
      
      let colorIndex = 0;
      for (const player of gameState.players) {
        const color = PLAYER_COLORS[colorIndex % PLAYER_COLORS.length];
        const div = document.createElement('div');
        div.className = 'player-item';
        div.innerHTML = `
          <span class="player-color" style="background: ${color}"></span>
          <span>${player.name}</span>
          ${player.id === myPlayerId ? '<small>(我)</small>' : ''}
        `;
        container.appendChild(div);
        colorIndex++;
      }
    }
    
    function addEvent(type, message) {
      const container = document.getElementById('events-container');
      const div = document.createElement('div');
      div.className = `event-item ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.insertBefore(div, container.firstChild);
      
      // 限制显示数量
      while (container.children.length > 50) {
        container.removeChild(container.lastChild);
      }
    }
    
    // ==================== 启动时测试连接 ====================
    connect().then(() => {
      updateStatus('connected', '已连接，请输入角色名加入游戏');
    }).catch(() => {
      updateStatus('disconnected', '无法连接到服务器 (请先运行 partykit dev)');
    });
  </script>
</body>
</html>
