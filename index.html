<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艾瑟雅大陆 - Agent生态圈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #e0e0e0; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 { text-align: center; font-size: 2rem; margin-bottom: 10px; background: linear-gradient(90deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { text-align: center; color: #888; margin-bottom: 20px; }
    .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    .panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .panel-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .agent-card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; }
    .agent-emoji { font-size: 2rem; }
    .agent-info { flex: 1; }
    .agent-name { font-weight: 600; }
    .agent-status { font-size: 0.8rem; color: #888; }
    .agent-defect { font-size: 0.7rem; color: #f59e0b; }
    .hp-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 3px; transition: width 0.3s; }
    .floor-map { font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.2; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; overflow-x: auto; white-space: pre; }
    .floor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .events-list { max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .event-item { padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 0.85rem; border-left: 3px solid #667eea; }
    .event-item.combat { border-left-color: #ef4444; }
    .event-item.friendly_fire, .event-item.defect { border-left-color: #f59e0b; }
    .event-item.kill { border-left-color: #10b981; }
    .event-item.chest { border-left-color: #eab308; }
    .event-item.collision { border-left-color: #8b5cf6; }
    .event-item.gathering { border-left-color: #ec4899; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
    button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .tick-counter { text-align: center; font-size: 0.9rem; color: #888; margin-bottom: 15px; }
    .legend { display: flex; gap: 15px; justify-content: center; margin-top: 10px; font-size: 0.8rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .floors-container { display: flex; flex-direction: column; gap: 20px; }
    .error-msg { color: #ef4444; padding: 10px; background: rgba(239,68,68,0.1); border-radius: 8px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏰 艾瑟雅大陆 - Agent生态圈</h1>
    <p class="subtitle">6个独特Agent的有趣互动</p>
    
    <div id="errorMsg" class="error-msg" style="display:none"></div>
    
    <div class="controls">
      <button class="btn-primary" id="btnAuto">🚀 自动运行</button>
      <button class="btn-secondary" id="btnStop">⏸️ 暂停</button>
      <button class="btn-secondary" id="btnStep">▶️ 单步</button>
      <button class="btn-danger" id="btnReset">🔄 重置</button>
    </div>
    
    <p class="tick-counter">Tick: <span id="tickCount">0</span> | 运行时间: <span id="runTime">0</span>s</p>
    
    <div class="main-grid">
      <div class="left-panel">
        <div class="panel">
          <div class="panel-title">👥 Agent家族</div>
          <div class="agents-grid" id="agentsGrid"></div>
          <div class="legend">
            <span class="legend-item">🧱墙</span>
            <span class="legend-item">👹怪物</span>
            <span class="legend-item">📦宝箱</span>
            <span class="legend-item">🚪出口</span>
            <span class="legend-item">·空地</span>
          </div>
        </div>
        <div class="panel" style="margin-top:20px">
          <div class="panel-title">🗺️ 生态圈地图</div>
          <div class="floors-container" id="floorsContainer"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">📜 实时事件</div>
        <div class="events-list" id="eventsList"></div>
      </div>
    </div>
  </div>

<script>
var autoTickInterval = null;
var tickSpeed = 500;
var latestEventId = 0;
var startTime = Date.now();

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function fetchStatus() {
  try {
    var res = await fetch('/api/ecosystem/status');
    var data = await res.json();
    updateUI(data);
  } catch (e) {
    showError('获取状态失败: ' + e.message);
  }
}

async function fetchEvents() {
  try {
    var res = await fetch('/api/ecosystem/events?since=' + latestEventId);
    var data = await res.json();
    if (data.events && data.events.length > 0) {
      latestEventId = data.latestId || 0;
      for (var i = 0; i < data.events.length; i++) {
        addEvent(data.events[i]);
      }
    }
  } catch (e) {
    // 静默失败
  }
}

async function singleTick() {
  try {
    var res = await fetch('/api/ecosystem/tick', { method: 'POST' });
    var data = await res.json();
    if (data.success) {
      document.getElementById('tickCount').textContent = data.tick;
    }
  } catch (e) {
    showError('Tick失败: ' + e.message);
  }
}

function startAutoTick() {
  if (autoTickInterval) clearInterval(autoTickInterval);
  autoTickInterval = setInterval(function() {
    singleTick();
    fetchEvents();
  }, tickSpeed);
}

function stopAutoTick() {
  if (autoTickInterval) {
    clearInterval(autoTickInterval);
    autoTickInterval = null;
  }
}

async function resetEcosystem() {
  stopAutoTick();
  location.reload();
}

function updateRunTime() {
  var seconds = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('runTime').textContent = seconds;
}

function updateUI(data) {
  document.getElementById('tickCount').textContent = data.tick || 0;
  
  var agentsGrid = document.getElementById('agentsGrid');
  agentsGrid.innerHTML = '';
  
  var agents = data.agents;
  for (var id in agents) {
    var agent = agents[id];
    var hpPercent = (agent.hp / agent.maxHp * 100).toFixed(0);
    var card = document.createElement('div');
    card.className = 'agent-card';
    card.innerHTML = 
      '<span class="agent-emoji">' + agent.emoji + '</span>' +
      '<div class="agent-info">' +
        '<div class="agent-name">' + agent.name + '</div>' +
        '<div class="agent-status">📍第' + agent.floor + '层 | ' + (agent.status === 'dead' ? '💀' : '🟢') + agent.status + '</div>' +
        '<div class="agent-defect">⚠️ ' + agent.defect + '</div>' +
        '<div class="hp-bar"><div class="hp-fill" style="width:' + hpPercent + '%"></div></div>' +
      '</div>';
    agentsGrid.appendChild(card);
  }
  
  var floorsContainer = document.getElementById('floorsContainer');
  floorsContainer.innerHTML = '';
  
  if (data.floors && data.floors.length > 0) {
    for (var i = 0; i < data.floors.length; i++) {
      var floor = data.floors[i];
      var floorDiv = document.createElement('div');
      var floorAgents = floor.agents || [];
      var openChests = 0;
      if (floor.chests) {
        for (var j = 0; j < floor.chests.length; j++) {
          if (!floor.chests[j].opened) openChests++;
        }
      }
      
      var html = '<div class="floor">' +
        '<div class="floor-header"><strong>第' + floor.floor + '层 - ' + floor.name + '</strong>' +
        '<span>👹' + (floor.monsters ? floor.monsters.length : 0) + ' 📦' + openChests + '</span></div>' +
        '<div class="floor-map" id="map-' + floor.floor + '"></div></div>';
      floorDiv.innerHTML = html;
      floorsContainer.appendChild(floorDiv);
      
      var mapDiv = document.getElementById('map-' + floor.floor);
      var mapHtml = '';
      for (var y = 0; y < floor.maze.length; y++) {
        var row = floor.maze[y];
        for (var x = 0; x < row.length; x++) {
          var cell = row[x];
          var agentHere = null;
          for (var k = 0; k < floorAgents.length; k++) {
            if (floorAgents[k].pos.x === x && floorAgents[k].pos.y === y) {
              agentHere = floorAgents[k];
              break;
            }
          }
          if (agentHere) {
            mapHtml += agentHere.emoji;
          } else {
            mapHtml += cell;
          }
        }
        mapHtml += '\n';
      }
      mapDiv.textContent = mapHtml;
    }
  }
}

function addEvent(event) {
  var list = document.getElementById('eventsList');
  var item = document.createElement('div');
  item.className = 'event-item ' + (event.type || '');
  var time = new Date(event.timestamp).toLocaleTimeString();
  item.innerHTML = 
    '<div class="event-time">' + time + ' [' + (event.type || '') + '] ' + (event.agentEmoji || '') + (event.agent || '') + '</div>' +
    '<div class="event-message">' + (event.message || '') + '</div>';
  list.insertBefore(item, list.firstChild);
  while (list.children.length > 30) {
    list.removeChild(list.lastChild);
  }
}

// 按钮事件
document.getElementById('btnAuto').onclick = startAutoTick;
document.getElementById('btnStop').onclick = stopAutoTick;
document.getElementById('btnStep').onclick = singleTick;
document.getElementById('btnReset').onclick = resetEcosystem;

// 初始化
fetchStatus();
startAutoTick();
setInterval(fetchStatus, 2000);
setInterval(updateRunTime, 1000);
</script>
</body>
</html>
