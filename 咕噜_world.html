<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>🎮 智障探险队 - 咕噜的世界</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', cursive, monospace;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            overflow-x: hidden;
            transform: scale(1.5);
            transform-origin: top left;
            width: 66.67%;
        }
        
        /* 顶部标题栏 */
        .header {
            background: linear-gradient(180deg, #4a3728 0%, #2d1f15 100%);
            border-bottom: 4px solid #6b4423;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 4px 0 #1a0f08;
        }
        
        .header h1 {
            font-size: 14px;
            color: #ffd700;
            text-shadow: 2px 2px 0 #8b4513;
            letter-spacing: 2px;
        }
        
        .header .subtitle {
            font-size: 8px;
            color: #aaa;
            margin-top: 6px;
        }
        
        /* 主容器 */
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* 像素风格边框 */
        .pixel-border {
            background: #2a2a3e;
            border: 4px solid #4a4a6a;
            box-shadow: 
                inset 0 0 0 2px #1a1a2e,
                inset 0 0 0 4px #3a3a5a,
                4px 4px 0 #0a0a1e;
        }
        
        /* 地图区域 */
        .map-section {
            flex: 1;
            min-width: 320px;
        }
        
        .section-title {
            background: #3a3a5a;
            padding: 8px 12px;
            font-size: 10px;
            color: #ffd700;
            border-bottom: 2px solid #4a4a6a;
        }
        
        .canvas-wrapper {
            padding: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #gameCanvas {
            display: block;
            background: #0a0a1e;
            image-rendering: pixelated;
            border: 2px solid #3a3a5a;
        }
        
        /* 状态面板 */
        .status-panel {
            width: 200px;
            min-width: 180px;
        }
        
        .status-section {
            margin-bottom: 15px;
        }
        
        .status-item {
            padding: 10px 12px;
            border-bottom: 2px solid #3a3a5a;
        }
        
        .status-label {
            font-size: 8px;
            color: #888;
            margin-bottom: 6px;
        }
        
        .status-value {
            font-size: 10px;
            color: #fff;
        }
        
        .status-bar {
            height: 12px;
            background: #1a1a2e;
            border: 2px solid #3a3a5a;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .status-bar-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .hunger-fill {
            background: linear-gradient(180deg, #ff6b6b 0%, #c92a2a 100%);
        }
        
        .hunger-fill.warning {
            background: linear-gradient(180deg, #ffa500 0%, #ff8c00 100%);
        }
        
        .hunger-fill.danger {
            background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%);
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .health-fill {
            background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
        }
        
        .pinyin-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #ff4757;
            color: #fff;
            font-size: 7px;
            animation: blink 0.3s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* 对话和思考气泡 */
        .bubbles-section {
            width: 100%;
        }
        
        .bubble {
            padding: 12px 15px;
            margin: 10px 0;
            position: relative;
            min-height: 40px;
        }
        
        .thought-bubble {
            background: #2d3561;
            border-left: 4px solid #5f7fff;
        }
        
        .thought-bubble::before {
            content: '🤔';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .dialogue-bubble {
            background: #3d5a45;
            border-left: 4px solid #51cf66;
        }
        
        .dialogue-bubble::before {
            content: '💬';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .bubble-content {
            font-size: 9px;
            line-height: 1.8;
            color: #ddd;
            padding-left: 10px;
        }
        
        .bubble-content:empty::after {
            content: '...';
            animation: dots 1s infinite;
        }
        
        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }
        
        /* 事件日志 */
        .log-section {
            width: 100%;
        }
        
        .log-container {
            height: 100px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .log-container::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        .log-container::-webkit-scrollbar-thumb {
            background: #4a4a6a;
        }
        
        .log-entry {
            font-size: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #2a2a4a;
            color: #aaa;
        }
        
        .log-entry .time {
            color: #666;
            margin-right: 8px;
        }
        
        .log-entry.event-attack { color: #ff6b6b; }
        .log-entry.event-move { color: #74c0fc; }
        .log-entry.event-think { color: #b197fc; }
        .log-entry.event-pinyin { color: #ffa8a8; }
        .log-entry.event-bump { color: #ffa94d; }
        
        /* 位置信息 */
        .position-info {
            font-size: 8px;
            color: #ffd700;
            padding: 8px 12px;
            background: #2a2a3e;
        }
        
        /* 装饰元素 */
        .sparkle {
            animation: sparkle 1.5s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 11px;
            }
            
            .status-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <header class="header">
        <h1>🎮 智障探险队 - 咕噜的世界</h1>
        <div class="subtitle">艾瑟雅大陆 · 野猪人探险记</div>
    </header>
    
    <!-- 主内容 -->
    <main class="container">
        <!-- 地图区域 -->
        <section class="map-section pixel-border">
            <div class="section-title">📍 像素地图</div>
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="320" height="240"></canvas>
            </div>
            <div class="position-info">
                📍 位置: (<span id="posX">5</span>, <span id="posY">5</span>) · 朝向: <span id="facing">下</span>
            </div>
        </section>
        
        <!-- 状态面板 -->
        <aside class="status-panel pixel-border">
            <div class="section-title">🐗 咕噜状态</div>
            
            <div class="status-section">
                <div class="status-item">
                    <div class="status-label">🍖 饥饿值</div>
                    <div class="status-value"><span id="hungerValue">80</span>/100</div>
                    <div class="status-bar">
                        <div class="status-bar-fill hunger-fill" id="hungerBar" style="width: 80%"></div>
                    </div>
                </div>
                
                <div class="status-item">
                    <div class="status-label">❤️ 生命值</div>
                    <div class="status-value"><span id="hpValue">100</span>/100</div>
                    <div class="status-bar">
                        <div class="status-bar-fill health-fill" id="hpBar" style="width: 100%"></div>
                    </div>
                </div>
                
                <div class="status-item">
                    <div class="status-label">🧠 脑子状态</div>
                    <div class="status-value" id="brainStatus">
                        <span style="color: #ffd700;">🤔 有点不对劲...</span>
                    </div>
                </div>
                
                <div class="status-item">
                    <div class="status-label">📊 状态</div>
                    <div class="status-value" id="overallStatus" style="color: #51cf66;">饱饱的</div>
                </div>
            </div>
            
            <div class="section-title">👁️ 视野 (3格)</div>
            <div class="status-item">
                <div class="status-value" id="vision" style="color: #74c0fc; font-size: 8px; line-height: 1.6;">
                    正在扫描...
                </div>
            </div>
        </aside>
        
        <!-- 对话气泡 -->
        <section class="bubbles-section pixel-border">
            <div class="section-title">💭 咕噜的想法</div>
            <div class="bubble thought-bubble">
                <div class="bubble-content" id="thoughtText"></div>
            </div>
            
            <div class="bubble dialogue-bubble">
                <div class="bubble-content" id="dialogueText"></div>
            </div>
        </section>
        
        <!-- 事件日志 -->
        <section class="log-section pixel-border">
            <div class="section-title">📜 事件日志</div>
            <div class="log-container" id="logContainer">
                <div class="log-entry">
                    <span class="time">[00:00]</span> 🎮 游戏初始化完成...
                </div>
            </div>
        </section>
    </main>
    
    <script>
        // ============ 素材加载 ============
        const SpriteSheets = {
            tiles: null,
            gulu: null,
            guluFull: null,      // 正反面素材
            characters: null,
            charactersFull: null, // 正反面素材
            items: null,
            loaded: false
        };
        
        // ============ 角色朝向配置 ============
        const FACING = {
            UP: 'back',
            DOWN: 'front', 
            LEFT: 'front',
            RIGHT: 'front'
        };
        
        // ============ 瓦片配置 ============
        const TILES = {
            GRASS: 0,   // 草地
            WALL: 1,    // 石墙
            CHEST: 2,   // 宝箱
            DIRT: 3,    // 泥土
            VOID: 4     // 边界/虚空
        };
        
        // 瓦片尺寸配置
        const TILE_SPRITE = {
            srcWidth: 250,   // 源图片中每个瓦片的宽度
            srcHeight: 250,  // 源图片中每个瓦片的高度
            cols: 5          // 每行瓦片数
        };
        
        // ============ 咕噜精灵配置 (正反面素材 + 攻击素材) ============
        const GULU_SPRITE = {
            // gulu_full.png: 1254x1254, 5列(4帧walk + 1帧idle) x 2行(front/back)
            full: {
                srcWidth: 250,        // 单帧宽度 (1254/5)
                srcHeight: 627,       // 单行高度 (1254/2)
                frontRow: 0,          // 正面行
                backRow: 1,           // 背面行
                walkCol: 0,           // 行走帧起始列
                walkFrames: 4,        // 行走帧数
                idleCol: 4,           // idle帧列
                idleFrames: 1         // idle帧数
            },
            // gulu.png: 攻击帧 (1254x1672, 6列 x 4行)
            attack: {
                srcWidth: 209,        // 单帧宽度 (1254/6)
                srcHeight: 418,       // 单行高度 (1672/4)
                row: 2,               // attack行
                frames: 6             // 攻击帧数
            },
            // 动画速度（毫秒）
            idleSpeed: 500,
            walkSpeed: 150,
            attackSpeed: 100
        };
        
        // 获取咕噜当前朝向对应的行
        function getGuluRow(facing) {
            const facingType = FACING[facing.toUpperCase()] || 'front';
            return facingType === 'back' ? GULU_SPRITE.full.backRow : GULU_SPRITE.full.frontRow;
        }
        
        // ============ 角色精灵配置 (正反面素材) ============
        const CHARACTER_SPRITE = {
            // characters_full.png: 1254x1254, 3列 x 3行
            srcWidth: 418,        // 单帧宽度 (1254/3)
            srcHeight: 418,       // 单行高度 (1254/3)
            // 角色行配置
            grammarRow: 0,        // 杠精博士
            echoRow: 1,           // 复读机
            saintRow: 2,          // 圣母心
            // 列配置
            frontCol: 0,          // 正面列
            backCol: 1,           // 背面列
            walkCol: 2,           // 行走列
            walkFrames: 4,       // 行走帧数
            idleFrames: 1        // idle帧数
        };
        
        // ============ 游戏状态 ============
        const GameState = {
            map: [],
            mapWidth: 10,
            mapHeight: 8,
            tileSize: 32,
            character: {
                x: 5,
                y: 4,
                facing: 'down',
                frame: 0,
                action: 'idle',  // idle, walk, attack
                animTime: 0
            },
            status: {
                hunger: 80,
                hp: 100,
                maxHp: 100,
                pinyinActive: false
            },
            thought: '',
            dialogue: '',
            events: []
        };
        
        // ============ Canvas 绘制 ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // 保持像素风格
        
        // ============ 加载素材 ============
        function loadSpriteSheets() {
            return new Promise((resolve) => {
                let loadedCount = 0;
                const total = 6;  // 6个素材
                
                function checkLoaded() {
                    loadedCount++;
                    if (loadedCount >= total) {
                        SpriteSheets.loaded = true;
                        resolve();
                    }
                }
                
                // 加载 tiles.png
                SpriteSheets.tiles = new Image();
                SpriteSheets.tiles.onload = checkLoaded;
                SpriteSheets.tiles.onerror = () => {
                    console.warn('tiles.png 加载失败，使用备用绘制');
                    checkLoaded();
                };
                SpriteSheets.tiles.src = 'assets/tiles.png';
                
                // 加载 gulu.png (攻击帧)
                SpriteSheets.gulu = new Image();
                SpriteSheets.gulu.onload = checkLoaded;
                SpriteSheets.gulu.onerror = () => {
                    console.warn('gulu.png 加载失败');
                    checkLoaded();
                };
                SpriteSheets.gulu.src = 'assets/gulu.png';
                
                // 加载 gulu_full.png (正反面idle+walk)
                SpriteSheets.guluFull = new Image();
                SpriteSheets.guluFull.onload = checkLoaded;
                SpriteSheets.guluFull.onerror = () => {
                    console.warn('gulu_full.png 加载失败');
                    checkLoaded();
                };
                SpriteSheets.guluFull.src = 'assets/gulu_full.png';
                
                // 加载 characters.png
                SpriteSheets.characters = new Image();
                SpriteSheets.characters.onload = checkLoaded;
                SpriteSheets.characters.onerror = () => {
                    console.warn('characters.png 加载失败');
                    checkLoaded();
                };
                SpriteSheets.characters.src = 'assets/characters.png';
                
                // 加载 characters_full.png (正反面)
                SpriteSheets.charactersFull = new Image();
                SpriteSheets.charactersFull.onload = checkLoaded;
                SpriteSheets.charactersFull.onerror = () => {
                    console.warn('characters_full.png 加载失败');
                    checkLoaded();
                };
                SpriteSheets.charactersFull.src = 'assets/characters_full_v2.png';
                
                // 加载 items.png
                SpriteSheets.items = new Image();
                SpriteSheets.items.onload = checkLoaded;
                SpriteSheets.items.onerror = () => {
                    console.warn('items.png 加载失败');
                    checkLoaded();
                };
                SpriteSheets.items.src = 'assets/items.png';
            });
        }
        
        // 获取瓦片的源坐标
        function getTileSource(tileIndex) {
            const col = tileIndex % TILE_SPRITE.cols;
            const sx = col * TILE_SPRITE.srcWidth;
            const sy = 0;
            return { sx, sy, sw: TILE_SPRITE.srcWidth, sh: TILE_SPRITE.srcHeight };
        }
        
        // 获取咕噜精灵帧（混合素材：idle/walk用gulu_full, attack用gulu）
        function getGuluFrame(action, frameIndex, facing = 'DOWN') {
            if (action === 'attack') {
                // attack使用gulu.png (正面攻击帧)
                const sx = frameIndex * GULU_SPRITE.attack.srcWidth;
                const sy = GULU_SPRITE.attack.row * GULU_SPRITE.attack.srcHeight;
                return {
                    sx, sy,
                    sw: GULU_SPRITE.attack.srcWidth,
                    sh: GULU_SPRITE.attack.srcHeight,
                    source: SpriteSheets.gulu
                };
            } else {
                // idle和walk使用gulu_full.png (根据朝向选择正面/背面)
                const row = getGuluRow(facing);
                let col, frameWidth;
                
                if (action === 'idle') {
                    col = GULU_SPRITE.full.idleCol;
                    frameWidth = GULU_SPRITE.full.srcWidth;
                } else {
                    col = GULU_SPRITE.full.walkCol + frameIndex;
                    frameWidth = GULU_SPRITE.full.srcWidth;
                }
                
                const sx = col * frameWidth;
                const sy = row * GULU_SPRITE.full.srcHeight;
                return {
                    sx, sy,
                    sw: frameWidth,
                    sh: GULU_SPRITE.full.srcHeight,
                    source: SpriteSheets.guluFull
                };
            }
        }
        
        // 初始化地图
        function initMap() {
            GameState.map = [];
            for (let y = 0; y < GameState.mapHeight; y++) {
                const row = [];
                for (let x = 0; x < GameState.mapWidth; x++) {
                    // 边界是墙
                    if (x === 0 || x === GameState.mapWidth - 1 || y === 0 || y === GameState.mapHeight - 1) {
                        row.push(TILES.WALL);
                    } else {
                        row.push(TILES.GRASS);
                    }
                }
                GameState.map.push(row);
            }
            
            // 添加一些墙壁
            GameState.map[2][3] = TILES.WALL;
            GameState.map[2][4] = TILES.WALL;
            GameState.map[2][5] = TILES.WALL;
            GameState.map[5][6] = TILES.WALL;
            GameState.map[6][6] = TILES.WALL;
            
            // 添加宝箱
            GameState.map[3][7] = TILES.CHEST;
            GameState.map[6][2] = TILES.CHEST;
            
            // 添加泥土装饰
            GameState.map[4][2] = TILES.DIRT;
            GameState.map[7][4] = TILES.DIRT;
        }
        
        // 绘制地图
        function drawMap() {
            const ts = GameState.tileSize;
            
            for (let y = 0; y < GameState.mapHeight; y++) {
                for (let x = 0; x < GameState.mapWidth; x++) {
                    const tile = GameState.map[y][x];
                    const px = x * ts;
                    const py = y * ts;
                    
                    // 绘制瓦片
                    if (SpriteSheets.loaded && SpriteSheets.tiles.complete) {
                        const src = getTileSource(tile);
                        ctx.drawImage(
                            SpriteSheets.tiles,
                            src.sx, src.sy, src.sw, src.sh,  // 源区域
                            px, py, ts, ts                   // 目标区域
                        );
                    } else {
                        // 备用绘制
                        drawFallbackTile(tile, px, py, ts);
                    }
                }
            }
        }
        
        // 备用瓦片绘制
        function drawFallbackTile(tile, px, py, ts) {
            const colors = {
                grass: '#3d8b40',
                grassDark: '#2d7a30',
                wall: '#4a4a5a',
                wallDark: '#3a3a4a',
                wallLight: '#5a5a6a',
                chest: '#8b4513',
                chestGold: '#ffd700',
                dirt: '#8b6914',
                dirtDark: '#6b4914'
            };
            
            switch (tile) {
                case TILES.GRASS:
                    ctx.fillStyle = colors.grass;
                    ctx.fillRect(px, py, ts, ts);
                    ctx.fillStyle = colors.grassDark;
                    for (let i = 0; i < 3; i++) {
                        const gx = px + (x * 7 + i * 11) % 28 + 2;
                        const gy = py + (y * 13 + i * 7) % 28 + 2;
                        ctx.fillRect(gx, gy, 2, 4);
                    }
                    break;
                case TILES.WALL:
                    ctx.fillStyle = colors.wall;
                    ctx.fillRect(px, py, ts, ts);
                    ctx.fillStyle = colors.wallLight;
                    ctx.fillRect(px, py, ts - 2, 4);
                    ctx.fillStyle = colors.wallDark;
                    ctx.fillRect(px, py + ts - 4, ts, 4);
                    break;
                case TILES.CHEST:
                    ctx.fillStyle = colors.grass;
                    ctx.fillRect(px, py, ts, ts);
                    ctx.fillStyle = colors.chest;
                    ctx.fillRect(px + 6, py + 10, 20, 14);
                    ctx.fillStyle = colors.chestGold;
                    ctx.fillRect(px + 8, py + 12, 16, 10);
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.fillRect(px + 4, py + 8, 24, 18);
                    break;
                case TILES.DIRT:
                    ctx.fillStyle = colors.dirt;
                    ctx.fillRect(px, py, ts, ts);
                    ctx.fillStyle = colors.dirtDark;
                    ctx.fillRect(px + 4, py + 8, 4, 4);
                    ctx.fillRect(px + 20, py + 16, 4, 4);
                    break;
                case TILES.VOID:
                default:
                    ctx.fillStyle = '#000';
                    ctx.fillRect(px, py, ts, ts);
                    break;
            }
        }
        
        // 绘制咕噜（使用精灵图 - 混合素材）
        function drawGulugulu() {
            const ts = GameState.tileSize;
            const charX = GameState.character.x * ts;
            const charY = GameState.character.y * ts;
            const action = GameState.character.action;
            const frame = GameState.character.frame;
            const facing = GameState.character.facing;
            
            // 计算动画帧
            const now = Date.now();
            const animElapsed = now - GameState.character.animTime;
            let currentFrame = frame;
            let maxFrames;
            
            switch (action) {
                case 'idle':
                    maxFrames = GULU_SPRITE.full.idleFrames;
                    if (animElapsed > GULU_SPRITE.idleSpeed) {
                        currentFrame = (frame + 1) % maxFrames;
                        GameState.character.frame = currentFrame;
                        GameState.character.animTime = now;
                    }
                    break;
                case 'walk':
                    maxFrames = GULU_SPRITE.full.walkFrames;
                    if (animElapsed > GULU_SPRITE.walkSpeed) {
                        currentFrame = (frame + 1) % maxFrames;
                        GameState.character.frame = currentFrame;
                        GameState.character.animTime = now;
                    }
                    break;
                case 'attack':
                    maxFrames = GULU_SPRITE.attack.frames;
                    if (animElapsed > GULU_SPRITE.attackSpeed) {
                        currentFrame = (frame + 1) % maxFrames;
                        if (currentFrame === 0) {
                            GameState.character.action = 'idle';
                        }
                        GameState.character.frame = currentFrame;
                        GameState.character.animTime = now;
                    }
                    break;
            }
            
            // 使用精灵图绘制（混合素材）
            const src = getGuluFrame(action, currentFrame, facing);
            if (src.source && src.source.complete) {
                // 角色居中显示，根据帧比例调整绘制尺寸
                // 源帧约250x627，宽高比约1:2.5，需要适配32x32的tile
                const drawHeight = ts * 2;  // 高度适配tile
                const drawWidth = drawHeight * (src.sw / src.sh);  // 按比例计算宽度
                const offsetX = (ts - drawWidth) / 2;
                const offsetY = ts - drawHeight;  // 底部对齐
                
                ctx.drawImage(
                    src.source,
                    src.sx, src.sy, src.sw, src.sh,
                    charX + offsetX, charY + offsetY, drawWidth, drawHeight
                );
            } else {
                // 备用绘制
                drawFallbackGulu(charX, charY);
            }
        }
        
        // 备用咕噜绘制
        function drawFallbackGulu(x, y) {
            const bounce = Math.sin(Date.now() / 200) * 2;
            
            ctx.fillStyle = '#8b6914';
            // 身体
            ctx.fillRect(x + 8, y + 12 + bounce, 16, 14);
            // 头
            ctx.fillRect(x + 6, y + 4 + bounce, 20, 12);
            // 耳朵
            ctx.fillRect(x + 4, y + 2 + bounce, 6, 6);
            ctx.fillRect(x + 22, y + 2 + bounce, 6, 6);
            // 獠牙
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 8, y + 14 + bounce, 3, 4);
            ctx.fillRect(x + 21, y + 14 + bounce, 3, 4);
            // 眼睛
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 10, y + 8 + bounce, 3, 3);
            ctx.fillRect(x + 19, y + 8 + bounce, 3, 3);
            // 方向指示
            ctx.fillStyle = '#ffd700';
            const dirOffsets = {
                'up': { dx: 12, dy: -4 },
                'down': { dx: 12, dy: 24 },
                'left': { dx: -4, dy: 14 },
                'right': { dx: 28, dy: 14 }
            };
            const dir = dirOffsets[GameState.character.facing];
            ctx.fillRect(x + dir.dx, y + dir.dy, 4, 4);
        }
        
        // 主绘制循环
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();
            drawGulugulu();
            requestAnimationFrame(render);
        }
        
        // ============ 状态更新 ============
        function updateStatusDisplay() {
            document.getElementById('hungerValue').textContent = GameState.status.hunger;
            const hungerBar = document.getElementById('hungerBar');
            hungerBar.style.width = GameState.status.hunger + '%';
            hungerBar.className = 'status-bar-fill hunger-fill';
            if (GameState.status.hunger < 30) {
                hungerBar.classList.add('danger');
            } else if (GameState.status.hunger < 50) {
                hungerBar.classList.add('warning');
            }
            
            document.getElementById('hpValue').textContent = GameState.status.hp;
            document.getElementById('hpBar').style.width = (GameState.status.hp / GameState.status.maxHp * 100) + '%';
            
            const brainStatus = document.getElementById('brainStatus');
            if (GameState.status.pinyinActive) {
                brainStatus.innerHTML = '<span class="pinyin-badge">⚠️ PINYIN爆发中!</span>';
            } else {
                brainStatus.innerHTML = '<span style="color: #ffd700;">🤔 有点不对劲...</span>';
            }
            
            const overallStatus = document.getElementById('overallStatus');
            if (GameState.status.hunger >= 70) {
                overallStatus.textContent = '饱饱的';
                overallStatus.style.color = '#51cf66';
            } else if (GameState.status.hunger >= 50) {
                overallStatus.textContent = '还行';
                overallStatus.style.color = '#94d82d';
            } else if (GameState.status.hunger >= 30) {
                overallStatus.textContent = '有点饿';
                overallStatus.style.color = '#ffa500';
            } else if (GameState.status.hunger >= 10) {
                overallStatus.textContent = '饿死了!';
                overallStatus.style.color = '#ff6b6b';
            } else {
                overallStatus.textContent = '饿疯了!!';
                overallStatus.style.color = '#ff0000';
            }
            
            document.getElementById('posX').textContent = GameState.character.x;
            document.getElementById('posY').textContent = GameState.character.y;
            const facingNames = { up: '上', down: '下', left: '左', right: '右' };
            document.getElementById('facing').textContent = facingNames[GameState.character.facing];
            
            document.getElementById('thoughtText').textContent = GameState.thought || '';
            document.getElementById('dialogueText').textContent = GameState.dialogue || '';
        }
        
        function addLog(message, type = '') {
            const container = document.getElementById('logContainer');
            const now = new Date();
            const time = now.toTimeString().slice(0, 5);
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            container.insertBefore(entry, container.firstChild);
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }
        
        // ============ 键盘控制 ============
        function handleKeyDown(e) {
            let dx = 0, dy = 0;
            let moved = false;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    dy = -1;
                    GameState.character.facing = 'up';
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    dy = 1;
                    GameState.character.facing = 'down';
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    dx = -1;
                    GameState.character.facing = 'left';
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    dx = 1;
                    GameState.character.facing = 'right';
                    break;
                case ' ':
                    // 攻击
                    GameState.character.action = 'attack';
                    GameState.character.frame = 0;
                    GameState.character.animTime = Date.now();
                    addLog('💥 咕噜发起攻击！', 'event-attack');
                    return;
                default:
                    return;
            }
            
            e.preventDefault();
            
            // 尝试移动
            const newX = GameState.character.x + dx;
            const newY = GameState.character.y + dy;
            
            if (newX >= 0 && newX < GameState.mapWidth && newY >= 0 && newY < GameState.mapHeight) {
                const targetTile = GameState.map[newY][newX];
                if (targetTile !== TILES.WALL) {
                    GameState.character.x = newX;
                    GameState.character.y = newY;
                    GameState.character.action = 'walk';
                    GameState.character.frame = 0;
                    GameState.character.animTime = Date.now();
                    moved = true;
                    addLog(`🐗 咕噜移动到 (${newX}, ${newY})`, 'event-move');
                } else {
                    addLog('🚫 撞墙了！', 'event-bump');
                }
            }
            
            if (!moved) {
                // 恢复idle
                setTimeout(() => {
                    if (GameState.character.action === 'walk') {
                        GameState.character.action = 'idle';
                    }
                }, 200);
            }
        }
        
        document.addEventListener('keydown', handleKeyDown);
        
        // ============ API 交互 ============
        let apiEndpoint = 'http://localhost:3000';
        
        async function fetchStatus() {
            try {
                const response = await fetch(`${apiEndpoint}/api/status`);
                if (response.ok) {
                    const data = await response.json();
                    GameState.status.hunger = data.status.hunger;
                    GameState.status.hp = data.status.hp;
                    GameState.status.pinyinActive = data.status.pinyinActive;
                    GameState.character.x = data.status.position.x;
                    GameState.character.y = data.status.position.y;
                    GameState.character.facing = data.status.position.facing;
                    document.getElementById('vision').textContent = data.status.surroundings || '...';
                    updateStatusDisplay();
                    return data;
                }
            } catch (e) {}
            return null;
        }
        
        async function fetchDialogue() {
            try {
                const response = await fetch(`${apiEndpoint}/api/dialogue`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.thought && data.thought !== GameState.thought) {
                        GameState.thought = data.thought;
                        addLog('🤔 ' + data.thought, 'event-think');
                    }
                    if (data.dialogue && data.dialogue !== GameState.dialogue) {
                        GameState.dialogue = data.dialogue;
                        addLog('💬 ' + data.dialogue, '');
                    }
                    updateStatusDisplay();
                }
            } catch (e) {}
        }
        
        // ============ 模拟咕噜行为 ============
        const simulatedDialogues = [
            { thought: '那边有个宝箱！闪闪发光的！', dialogue: '嘿嘿！有宝贝！' },
            { thought: '好饿...肚子在叫...', dialogue: '啊啊啊！饿死了！' },
            { thought: '前面好像有东西...', dialogue: '谁在那里？！' },
            { thought: '脑子突然卡住了...', dialogue: 'zhe...zhe shi shen me...' },
            { thought: '队友？别挡路！', dialogue: '让开让开！' },
            { thought: '这墙怎么又撞到了...', dialogue: '哎哟！疼疼疼！' },
            { thought: '好像有人在背后...', dialogue: '谁偷袭我！？' },
            { thought: '今天天气不错，适合探险', dialogue: '冲啊！！' },
            { thought: '这食物闻起来好香', dialogue: '给我给我！' },
            { thought: '咦，队友怎么倒下了', dialogue: '啊？我打的？嘿嘿...' }
        ];
        
        function simulateGulugulu() {
            const directions = ['up', 'down', 'left', 'right'];
            const dir = directions[Math.floor(Math.random() * 4)];
            
            GameState.character.facing = dir;
            
            let moved = false;
            if (dir === 'up' && GameState.character.y > 1) {
                if (GameState.map[GameState.character.y - 1][GameState.character.x] !== TILES.WALL) {
                    GameState.character.y--;
                    moved = true;
                }
            } else if (dir === 'down' && GameState.character.y < GameState.mapHeight - 2) {
                if (GameState.map[GameState.character.y + 1][GameState.character.x] !== TILES.WALL) {
                    GameState.character.y++;
                    moved = true;
                }
            } else if (dir === 'left' && GameState.character.x > 1) {
                if (GameState.map[GameState.character.y][GameState.character.x - 1] !== TILES.WALL) {
                    GameState.character.x--;
                    moved = true;
                }
            } else if (dir === 'right' && GameState.character.x < GameState.mapWidth - 2) {
                if (GameState.map[GameState.character.y][GameState.character.x + 1] !== TILES.WALL) {
                    GameState.character.x++;
                    moved = true;
                }
            }
            
            if (moved) {
                GameState.character.action = 'walk';
                GameState.character.frame = 0;
                GameState.character.animTime = Date.now();
                addLog('🐗 咕噜移动到 (' + GameState.character.x + ', ' + GameState.character.y + ')', 'event-move');
                // 恢复idle
                setTimeout(() => {
                    GameState.character.action = 'idle';
                }, 500);
            } else {
                addLog('🚫 咕噜撞墙了！', 'event-bump');
            }
            
            const dialog = simulatedDialogues[Math.floor(Math.random() * simulatedDialogues.length)];
            GameState.thought = dialog.thought;
            GameState.dialogue = dialog.dialogue;
            
            if (Math.random() < 0.2) {
                GameState.status.pinyinActive = true;
                addLog('⚡ 拼音依赖发作！脑子卡壳了...', 'event-pinyin');
                setTimeout(() => {
                    GameState.status.pinyinActive = false;
                }, 3000);
            }
            
            GameState.status.hunger = Math.max(0, GameState.status.hunger - 5);
            updateStatusDisplay();
        }
        
        // ============ 初始化 ============
        async function init() {
            // 加载精灵图
            await loadSpriteSheets();
            
            initMap();
            addLog('🎮 像素世界初始化完成！', '');
            addLog('🐗 咕噜正在探索...', '');
            if (SpriteSheets.loaded) {
                addLog('✨ 素材加载成功！', '');
            }
            
            render();
            
            setInterval(async () => {
                const data = await fetchStatus();
                if (!data) {
                    simulateGulugulu();
                }
            }, 2000);
            
            setInterval(fetchDialogue, 2000);
            
            updateStatusDisplay();
        }
        
        init();
    </script>
</body>
</html>
